# Cloudflare Tunnel connector for the VPS. It joins `proxy-net`, where `subzerodev-com` already lives,
# so nothing is published on the host. TUNNEL_TOKEN comes from the stack environment (deploy/,
# OpenTofu). Layer it over docker-compose.yml. The tunnel serves www.subzerodev.com only: the apex and
# the hostnames that CNAME to it still reach the VPS through the proxy.
services:
  cloudflared:
    image: cloudflare/cloudflared:2025.11.1
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN}
    dns: [1.1.1.1, 9.9.9.9]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    networks:
      - proxy-net
    depends_on:
      - subzerodev-com
