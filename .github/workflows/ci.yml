name: CI

on:
  push:
  pull_request:

jobs:
  typecheck-and-test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx vitest run --config vitest.build.config.ts

  link-check:
    name: Link check
    runs-on: ubuntu-latest
    needs: typecheck-and-test
    # Fork PRs can edit src/content/projects.ts to point at an arbitrary host,
    # which this job would then reach out to from a GitHub-hosted runner. Skip
    # it for fork PRs; it still runs on push and on same-repo PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check-links
