name: CI

on:
  push:
  pull_request:

permissions: {}

jobs:
  typecheck-and-test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # verification: true
      - name: Typecheck
        run: npm run typecheck
      # verification: true
      - name: Test
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck-and-test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # verification: true
      - name: Interrogate the build artifact
        run: npx vitest run --config vitest.build.config.ts
      - uses: actions/upload-artifact@v4
        with:
          name: publishable-tree
          path: |
            site/dist
            site/server
          retention-days: 1

  # Builds the release image from the `build` job's finalized tree, starts it
  # and interrogates it with `npm run image-gate` before anything could push
  # it (design/30-slices.md § S9), then pushes the image that was gated and
  # redeploys it (§ S10). All of that is the shared container workflow: its
  # `Build` job downloads the tree, builds the root Dockerfile and runs the
  # image gate; `Publish`, with no approval to wait for, checks this commit is
  # still the tip of `main`, loads the saved image
  # (asserting it is the one that was gated) and pushes it; `Deploy` calls the
  # Portainer webhook and reads the endpoint back. It follows `link-check`
  # as well as `build`, so a broken link still stops the release before
  # anything is pushed; a skipped `link-check` (fork PRs) does not.
  image:
    needs: [build, link-check]
    if: ${{ !cancelled() && github.ref_type != 'tag' && needs.build.result == 'success' && (needs.link-check.result == 'success' || needs.link-check.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/container.yml@v0
    with:
      image-name: subzerodev-com
      tags: sha latest
      artifact: publishable-tree
      artifact-path: site
      smoke-port: '80'
      smoke-npm-scripts: image-gate
      node-version: '22'
      deploy: true
      post-deploy: tools/ci/read-back-release.sh
    secrets:
      DEPLOY_WEBHOOK_URL: ${{ secrets.PORTAINER_REDEPLOY_WEBHOOK_URL }}

  link-check:
    name: Link check
    runs-on: ubuntu-latest
    needs: typecheck-and-test
    # Fork PRs can edit site/projects.json to point at an arbitrary host,
    # which this job would then reach out to from a GitHub-hosted runner. Skip
    # it for fork PRs; it still runs on push and on same-repo PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # verification: true
      - name: Check links
        run: npm run check-links

  # Ungated Pages preview/development publishing (design/30-slices.md §
  # S10.6, *The publication CI*). Depends only on the shared `build` — never
  # on `image`'s gate or `link-check` — because no image gate or link gate
  # precedes the Pages publish (design/00-brief.md, design/10-design.md § *Publication
  # targets*). The shared Pages workflow deploys the `build` job's tree
  # unbuilt: its `Deploy` job runs in its own non-cancelling concurrency
  # group, checks this commit is still the tip of `main` before deploying
  # (S10.10) — a superseded run stops cleanly, not as a failure — and then
  # runs the read-back, which alone announces the preview URL (S10.8,
  # S10.9, V8). The release path is the `image` job and checks the branch
  # tip itself, in the shared container workflow.
  publish-preview:
    name: Publish preview
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/pages.yml@v0
    with:
      artifact: publishable-tree
      artifact-path: site
      scripts: ''
      output: site/dist
      node-version: '22'
      post-deploy: tools/ci/read-back-preview.sh
