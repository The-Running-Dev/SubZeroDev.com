name: CI

on:
  push:
  pull_request:

permissions: {}

jobs:
  typecheck-and-test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # verification: true
      - name: Typecheck
        run: npm run typecheck
      # verification: true
      - name: Test
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck-and-test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # verification: true
      - name: Interrogate the build artifact
        run: npx vitest run --config vitest.build.config.ts
      - uses: actions/upload-artifact@v4
        with:
          name: publishable-tree
          path: |
            site/dist
            site/server
          retention-days: 1

  # Builds the release image from the `build` job's finalized tree, starts it
  # and interrogates it with `npm run image-gate` before anything could push
  # it (design/30-slices.md § S9), then pushes the image that was gated and
  # redeploys it (§ S10). All of that is the shared container workflow: its
  # `Build` job downloads the tree, builds the root Dockerfile and runs the
  # image gate; `Publish` waits for the `SubZeroDev` environment's approval,
  # checks this commit is still the tip of `main`, loads the saved image
  # (asserting it is the one that was gated) and pushes it; `Deploy` calls the
  # Portainer webhook and reads the endpoint back. It follows `link-check`
  # as well as `build`, so a broken link still stops the release before
  # anything is pushed; a skipped `link-check` (fork PRs) does not.
  image:
    needs: [build, link-check]
    if: ${{ !cancelled() && github.ref_type != 'tag' && needs.build.result == 'success' && (needs.link-check.result == 'success' || needs.link-check.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/container.yml@v0
    with:
      image-name: subzerodev-com
      tags: sha latest
      artifact: publishable-tree
      artifact-path: site
      smoke-port: '80'
      smoke-npm-scripts: image-gate
      node-version: '22'
      environment: SubZeroDev
      deploy: true
      post-deploy: tools/ci/read-back-release.sh
    secrets:
      DEPLOY_WEBHOOK_URL: ${{ secrets.PORTAINER_REDEPLOY_WEBHOOK_URL }}

  link-check:
    name: Link check
    runs-on: ubuntu-latest
    needs: typecheck-and-test
    # Fork PRs can edit site/projects.json to point at an arbitrary host,
    # which this job would then reach out to from a GitHub-hosted runner. Skip
    # it for fork PRs; it still runs on push and on same-repo PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # verification: true
      - name: Check links
        run: npm run check-links

  # Ungated Pages preview/development publishing (design/30-slices.md §
  # S10.6, *The publication CI*). Depends only on the shared `build` — never
  # on `image-gate`, `link-check` or `attestation` — because no human
  # approval, image gate, link gate or truth attestation precedes the Pages
  # publish (design/00-brief.md, design/10-design.md § *Publication
  # targets*). Keeps its own non-cancelling concurrency group, and opens
  # with its own branch-head check so a superseded run stops cleanly rather
  # than being cancelled mid-publish. The release path is the `image` job
  # and checks the branch tip itself, in the shared container workflow.
  publish-preview:
    name: Publish preview
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: publishable-tree
          path: site

      # At the top of the critical section: an older queued run must not
      # overwrite a newer commit (design/10-design.md § *Concurrency and
      # ordering*). A stale candidate is a clean stop, not a failure (S10.10)
      # — `continue-on-error` keeps this job's conclusion green, and every
      # publishing step below is gated on this check having passed.
      - name: Read the deployment branch's current head
        id: branch-head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD=$(gh api repos/${{ github.repository }}/commits/main --jq '.sha')
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
      - name: Assert this commit is still the branch head
        id: candidate-check
        continue-on-error: true
        run: npm run deployment-candidate-gate
        env:
          GITHUB_SHA: ${{ github.sha }}
          BRANCH_HEAD: ${{ steps.branch-head.outputs.head }}
      - name: Stop cleanly — this commit is no longer the branch head
        if: steps.candidate-check.outcome == 'failure'
        run: |
          {
            echo "### Stale deployment candidate (preview)";
            echo "Commit \`${{ github.sha }}\` is no longer \`main\`'s head (\`${{ steps.branch-head.outputs.head }}\`). A newer run supersedes this one; stopping before publishing.";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Pages
        if: steps.candidate-check.outcome == 'success'
        uses: actions/configure-pages@v5
      - name: Upload the Pages artifact
        if: steps.candidate-check.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - name: Deploy to Pages
        if: steps.candidate-check.outcome == 'success'
        id: deploy-pages
        uses: actions/deploy-pages@v4

      # Only this read-back licenses the preview URL (S10.8, S10.9, V8) —
      # nothing above announces one.
      - name: Read back the deployed Pages apex
        if: steps.candidate-check.outcome == 'success'
        run: npm run publish-preview-gate
        env:
          GITHUB_SHA: ${{ github.sha }}
          PAGES_URL: ${{ steps.deploy-pages.outputs.page_url }}
      - name: Announce the preview URL
        if: steps.candidate-check.outcome == 'success'
        run: |
          {
            echo "### Preview published";
            echo "${{ steps.deploy-pages.outputs.page_url }}";
          } >> "$GITHUB_STEP_SUMMARY"

  # Records the human approval that gated the release (design/30-slices.md §
  # S10.5). The approval itself is the protected `SubZeroDev` GitHub
  # Environment on the shared container workflow's `Publish` job, so it is
  # that job that waits for the reviewer, not a job of this file; this job
  # follows `image`, reads the run's approval record for the approver and
  # asserts it (V5). Runs only on a push to `main`, as before: the branch's
  # own protection plus the environment's required-reviewer rule are what
  # make an approval unreplayable onto another run (U3,
  # design/90-decisions.md).
  attestation:
    name: Attestation
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Builds `Attestation.approver` from the run's own approval record
      # rather than from any input this run could carry — an approval can
      # therefore not be replayed onto another run (U3). `Attestation.commit`
      # is the run's own `head_sha`, i.e. `github.sha`, per the same entry.
      - name: Read the run's approval record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APPROVER=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/approvals" \
            --jq'[.[] | select(.state == "approved")] | last | .user.login // empty')
          echo "ATTESTATION_APPROVER=$APPROVER" >> "$GITHUB_ENV"
      - run: npm run attestation-gate
        env:
          GITHUB_SHA: ${{ github.sha }}
